# NOTE Github Actions execution environments lack a terminal, needed for
# some integration tests. So we use `script` command to fake a terminal.

name: ci
on:
  push:
    tags:
      - v*
    branches:
      - main
      - release-*
  merge_group:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same pull request. For everything else
# (in particular, pushes to a branch or a tag) there is no PR number, so
# the group falls back to the unique run_id and nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIBPATHRS_VERSION: "0.2.6"
  # Don't ignore C warnings. Note that the output of "go env CGO_CFLAGS" by default is "-g -O2", so we keep them.
  CGO_CFLAGS: -g -O2 -Werror
  # Allow potentially unsafe tests.
  RUNC_ALLOW_UNSAFE_TESTS: yes

jobs:
  crun-integration:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cgroup-manager: [cgroupfs, systemd]
    runs-on: ubuntu-24.04
    name: crun integration tests (${{ matrix.cgroup-manager }})

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: checkout crun
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: containers/crun
        path: crun

    - name: install deps
      run: |
        sudo apt update
        sudo apt -y install libseccomp-dev

    - name: install go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.x # Latest stable
        check-latest: true

    - name: build
      run: make RUNC_BUILDTAGS=-libpathrs runc

    - name: Allow userns for runc
      # See the same step in the test job above.
      run: |
        sed -E "s;^profile runc [^ ]+ ;profile runc-test $PWD/runc ;" < /etc/apparmor.d/runc | sudo apparmor_parser

    - name: run tests
      env:
        CGROUP_MANAGER: ${{ matrix.cgroup-manager }}
      run: sudo -E PATH="$PATH" tests/crun/run.sh crun

