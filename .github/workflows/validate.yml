name: validate
on:
  push:
    tags:
      - v*
    branches:
      - main
      - release-*
  merge_group:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same pull request. For everything else
# (in particular, pushes to a branch or a tag) there is no PR number, so
# the group falls back to the unique run_id and nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: 1.26
  LIBPATHRS_VERSION: "0.2.6"

jobs:
  binary-size:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # Needed to read the PR's labels.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Check out the PR head (not the merge commit), with full history.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: install go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: install deps
        run: |
          sudo apt update
          sudo apt -y install libseccomp-dev
      - name: install libpathrs ${{ env.LIBPATHRS_VERSION }}
        run: |
          sudo -E PATH="$PATH" ./script/build-libpathrs.sh "$LIBPATHRS_VERSION" /usr
      - name: build each commit and check binary size
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABEL: bloat-approved
        run: |
          # Labels are read via the API (rather than from the event payload)
          # so that re-running the job after adding the label works.
          labels=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[].name')
          if grep -Fxq "$LABEL" <<<"$labels"; then
            echo "Found $LABEL label, binary growth above the limit is allowed."
            export ALLOW_GROWTH=1
          fi
          ./script/check-binary-size.sh "$BASE_SHA"

  all-done-validate:
    # Jobs that are not applicable to the event (e.g. PR-only jobs on push)
    # are skipped, which by default skips this job, too. Run it anyway, and
    # fail if any of the needed jobs has failed or was cancelled.
    if: ${{ !cancelled() }}
    needs:
      - binary-size
    runs-on: ubuntu-24.04
    steps:
    - env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        failed=$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "::error::Job \(.key) result: \(.value.result)"' <<<"$NEEDS")
        if [ -n "$failed" ]; then
          echo "$failed"
          exit 1
        fi
        echo "All jobs completed"
